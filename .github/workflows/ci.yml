name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v5

      - name: .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Kompilacja
        run: dotnet build Jajcarz.slnx --configuration Release

      - name: Migracje zgodne z modelem
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/Jajcarz.Infrastructure \
            --startup-project src/Jajcarz.Infrastructure \
            --configuration Release

      - name: Testy na SQLite
        run: dotnet test Jajcarz.slnx --configuration Release --no-build

      - name: Testy na Postgresie
        run: dotnet test Jajcarz.slnx --configuration Release --no-build
        env:
          JAJCARZ_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Jajcarz.WebClient/package-lock.json

      - name: Interfejs
        working-directory: src/Jajcarz.WebClient
        run: |
          npm ci
          npm run build
          npm test
          npm audit --omit=dev --audit-level=high

  image:
    name: Obraz Dockera
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v5

      - name: Budowanie obrazu
        run: docker build --tag jajcarz:ci .

      - name: Start obrazu na czystej bazie
        run: bash deploy/smoke-test.sh jajcarz:ci

      - name: Poprawność plików wdrożenia
        run: |
          docker network create jajcarz-proxy
          JAJCARZ_HOSTNAME=test.example.com JAJCARZ_IMAGE=jajcarz:ci POSTGRES_PASSWORD=ci \
            docker compose -f deploy/compose.prod.yaml config --quiet
          docker run --rm -e JAJCARZ_HOSTNAME=test.example.com \
            -v "$PWD/deploy/Caddyfile.jajcarz:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish:
    name: Publikacja obrazu
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v5

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowanie i wysyłka
        run: |
          docker build --tag "ghcr.io/hubertborzymek/jajcarz:${GITHUB_REF_NAME}" .
          docker push "ghcr.io/hubertborzymek/jajcarz:${GITHUB_REF_NAME}"
